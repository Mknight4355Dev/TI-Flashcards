<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Study Sigma Tandem instructor questions with click-to-flip flashcards.">
  <title>Sigma Tandem Flashcards</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23163038'/%3E%3Cpath d='M8 9h16v14H8z' fill='none' stroke='%23bce5cb' stroke-width='2'/%3E%3C/svg%3E">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><div class="eyebrow">STUDY DECK</div><h1 id="title">Sigma Tandem Flashcards</h1><p id="description"></p></header>
    <div class="deck-bar"><span id="position" role="status">Loading cards…</span><span id="category"></span></div>
    <article id="card" class="card" role="button" tabindex="0" aria-label="Flip flashcard" aria-disabled="true">
      <div class="card-meta"><span id="side">QUESTION</span><span id="question-number"></span></div>
      <div id="content"><p>Loading your study deck…</p></div>
      <div id="hint" class="hint">Click the card to reveal the answer</div>
    </article>
    <nav aria-label="Flashcard navigation"><button id="previous" disabled>← Previous</button><button id="flip" class="primary" disabled>Show answer</button><button id="next" disabled>Next →</button></nav>
    <p class="keyboard">Space or Enter to flip · Arrow keys to navigate</p>
    <p id="policy" class="policy"></p>
  </main>
</body>
</html>
